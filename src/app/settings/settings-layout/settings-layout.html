<div class="layout">
  <aside class="sidebar">
    <app-brand subtitle="Settings" />

    <!-- The hotkey arrives with VAI-301; until then dictation isn't listening. -->
    <div class="status-card" data-testid="dictation-status">
      <div class="status"><span class="dot" aria-hidden="true"></span> Not active yet</div>
      <div class="how aiw-muted">
        @if (mode() === 'toggle') {
          Press <aiw-keys [keys]="toggleShortcut()" /> to dictate
        } @else {
          Hold <aiw-keys keys="Ctrl" /> to dictate
        }
      </div>
    </div>

    <nav aria-label="Settings sections" data-testid="settings-nav">
      <ul>
        @for (section of sections; track section.path) {
          <li>
            <a
              [routerLink]="section.path"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              [attr.data-testid]="'nav-' + section.path"
            >
              <aiw-icon [name]="section.icon" [size]="18" />
              {{ section.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="bottom">
      <a routerLink="/" class="back" data-testid="back-to-workspace">
        <aiw-icon name="chevron-left" [size]="16" />
        Back to workspace
      </a>
      @if (version(); as v) {
        <div class="version">Version {{ v }}</div>
      }
    </div>
  </aside>

  <main class="content aiw-dotted">
    <router-outlet />
  </main>
</div>
